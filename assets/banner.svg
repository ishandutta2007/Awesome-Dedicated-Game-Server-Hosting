<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Animation CSS -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .glowing-bg { animation: pulseGlow 4s ease-in-out infinite; }
      .animated-wire { stroke-dasharray: 8 8; animation: dashFlow 20s linear infinite; }
      .banner-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .banner-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Glowing Dynamic Background Elements (Behind Foreground) -->
  <circle cx="150" cy="100" r="180" fill="#00f2fe" opacity="0.12" class="glowing-bg" filter="blur(40px)" />
  <circle cx="1050" cy="300" r="220" fill="#818cf8" opacity="0.15" class="glowing-bg" filter="blur(50px)" />
  <circle cx="600" cy="200" r="150" fill="#c084fc" opacity="0.08" class="glowing-bg" filter="blur(60px)" />

  <!-- Dynamic Server / Connectivity Nodes Line Network -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" class="animated-wire">
    <line x1="100" y1="350" x2="300" y2="280" />
    <line x1="300" y1="280" x2="500" y2="340" />
    <line x1="500" y1="340" x2="700" y2="290" />
    <line x1="700" y1="290" x2="900" y2="350" />
    <line x1="900" y1="350" x2="1100" y2="270" />
  </g>

  <!-- Server Pod / Node Graphic Accents (Floating in Background) -->
  <g class="floating-node" opacity="0.7">
    <!-- Server Stack Icon Left -->
    <g transform="translate(80, 240)">
      <rect x="0" y="0" width="100" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="15" cy="12" r="3" fill="#22c55e" />
      <circle cx="27" cy="12" r="3" fill="#38bdf8" />
      <rect x="0" y="30" width="100" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="15" cy="42" r="3" fill="#22c55e" />
      <circle cx="27" cy="42" r="3" fill="#38bdf8" />
    </g>

    <!-- Server Stack Icon Right -->
    <g transform="translate(1020, 80)">
      <rect x="0" y="0" width="100" height="24" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <circle cx="15" cy="12" r="3" fill="#22c55e" />
      <circle cx="27" cy="12" r="3" fill="#818cf8" />
      <rect x="0" y="30" width="100" height="24" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <circle cx="15" cy="42" r="3" fill="#22c55e" />
      <circle cx="27" cy="42" r="3" fill="#818cf8" />
    </g>
  </g>

  <!-- Foreground Content Block (Layered high above dynamic background) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Badge -->
    <g transform="translate(435, 60)">
      <rect width="330" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="url(#cyanPurpleGrad)" stroke-width="1.5" />
      <text x="165" y="21" fill="#38bdf8" font-size="13" class="banner-sub" text-anchor="middle" letter-spacing="1">
        ⚡ MULTIPLAYER INFRASTRUCTURE DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" class="banner-title" font-size="44" fill="#ffffff">
      Awesome Dedicated Game Server Hosting
    </text>

    <!-- Gradient Subtitle -->
    <text x="600" y="200" text-anchor="middle" class="banner-title" font-size="40" fill="url(#textGrad)">
      🎮 ☁️ Enterprise Platforms &amp; Open-Source Orchestration
    </text>

    <!-- Description Lines -->
    <text x="600" y="250" text-anchor="middle" class="banner-sub" font-size="18" fill="#94a3b8">
      Curated Directory of Commercial Game Server Providers, Agones, Pterodactyl &amp; Bare-Metal Fleet Tools
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(310, 295)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="80" y="22" fill="#e2e8f0" font-size="13" class="banner-sub" text-anchor="middle">☁️ GameLift &amp; PlayFab</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="255" y="22" fill="#e2e8f0" font-size="13" class="banner-sub" text-anchor="middle">⚓ Agones Kubernetes</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="420" y="22" fill="#e2e8f0" font-size="13" class="banner-sub" text-anchor="middle">🦖 Pterodactyl Panel</text>

      <!-- Pill 4 -->
      <rect x="500" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="570" y="22" fill="#e2e8f0" font-size="13" class="banner-sub" text-anchor="middle">🎯 Matchmaking &amp; Edge</text>
    </g>
  </g>
</svg>
