<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="cyanPurpleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulseGlow{0%{opacity:.3}50%{opacity:.7}}.floating-node{animation:floatSlow 6s ease-in-out infinite}.glowing-bg{animation:pulseGlow 4s ease-in-out infinite}.animated-wire{stroke-dasharray:8 8;animation:dashFlow 20s linear infinite}.banner-sub,.banner-title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-title{font-weight:800}.banner-sub{font-weight:500}</style></defs><rect width="1200" height="400" fill="url(#bgGradient)"/><rect width="1200" height="400" fill="url(#grid)"/><circle cx="150" cy="100" r="180" fill="#00f2fe" class="glowing-bg" filter="blur(40px)" opacity=".12"/><circle cx="1050" cy="300" r="220" fill="#